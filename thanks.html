<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — The Velvet Hours</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #f3e9d8; color: #2b2118;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 2rem;
    background-image: radial-gradient(rgba(43,33,24,0.04) 1px, transparent 1px);
    background-size: 4px 4px;
  }
  .card {
    background: #e8dcc8; border: 2px solid #2b2118;
    padding: 3rem 2.5rem; max-width: 480px;
    box-shadow: 10px 10px 0 #7a1f2b;
  }
  .check { font-size: 4rem; margin-bottom: 1rem; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 2rem; margin-bottom: 1rem; }
  p { color: #8a7a66; margin-bottom: 2rem; line-height: 1.6; }
  .btn {
    display: inline-block; padding: .85rem 2.2rem;
    background: #2b2118; color: #f3e9d8; text-decoration: none;
    font-size: .78rem; letter-spacing: 2px; text-transform: uppercase;
    border: 2px solid #2b2118; transition: .25s;
  }
  .btn:hover { background: #7a1f2b; border-color: #7a1f2b; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>You're on the list!</h1>
    <p>Thanks for subscribing. We'll let you know about new music, tour dates and exclusive drops — no spam, just the good stuff.</p>
    <a href="index.html" class="btn">Back to Home</a>
  </div>
</body>
</html>
